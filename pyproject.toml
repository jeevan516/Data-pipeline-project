[project]
name = "mle-data-pipeline-project"
version = "0.1.0"
requires-python = ">=3.13.17"
dependencies = [
    "click>=8.5.0",
    "pandas>=3.0.5",
    "prefect>=3.8.6",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
]

[project.scripts]
green-taxi = "green_taxi.pipeline:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "green_taxi"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
]

[tool.ty.environment]
root = [".", "src", "solution/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.13.5"
# Apply certificate fixes without adding unused runtime packages.
# Prefect's server still uses FastAPI's removed min_items argument.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2", "fastapi<0.155"]
